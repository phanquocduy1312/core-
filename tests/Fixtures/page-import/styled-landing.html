<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Styled Landing Page</title>
    <style>
        .hero-section {
            background-color: #0f172a;
            padding-top: 96px;
            padding-bottom: 96px;
        }
        .hero-title {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            color: #ffffff;
        }
        .hero-subtitle {
            font-size: 18px;
            color: #cbd5e1;
        }
        .hero-btn {
            background-color: #e32326;
            border-radius: 12px;
            padding: 14px 28px;
        }
        .hero-split-grid {
            gap: 48px;
        }
        .hero-img {
            border-radius: 24px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <main>
        <section id="hero" class="hero-section">
            <div class="hero-split-grid">
                <div class="content-col">
                    <h1 class="hero-title">Đẳng Cấp Thượng Lưu</h1>
                    <p class="hero-subtitle">Trải nghiệm du thuyền đỉnh cao chuẩn quốc tế.</p>
                    <a href="/lien-he" class="btn hero-btn">Khám Phá</a>
                </div>
                <div class="media-col">
                    <img src="https://placehold.co/800x600" alt="Hero Yacht" class="hero-img" />
                </div>
            </div>
        </section>
    </main>
</body>
</html>
